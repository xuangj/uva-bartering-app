{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="mb-4">Change Profile Picture</h4>

          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {% if form.non_field_errors %}
            <div class="alert alert-danger">
              {{ form.non_field_errors }}
            </div>
            {% endif %}

            <div class="mb-3">
              {{ form.pfp }}
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'user_profile' username=request.user.username %}" class="btn btn-secondary ms-2">
              Cancel
            </a>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
