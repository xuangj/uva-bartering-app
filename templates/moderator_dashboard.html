<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UVA Trading App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <!-- NAV BAR -->
    {% include '_navbar.html'%}
    <div class="container py-4">
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for profile in profiles %}
                {% if not profile.user == request.user %}
                    <div class="col">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">
                                <h5><a href="{% url 'user_profile' username=profile.user.username %}" class="card-title">{{ profile.user.username }}</a></h5>
                                <p><strong>{{ profile.role }}</strong></p>
                                <p class="card-text">{{ profile.bio|truncatechars:120 }}</p>
                            </div>
                            <div class="card-footer text-muted d-flex justify-content-between align-items-center">
                                <div>
                                    <a href="{% url 'start_chat' profile.user.id %}" class="btn btn-md btn-primary">
                                        <i class="bi bi-chat-dots"></i> Message
                                    </a>
                                </div>
                                <a href="{% url 'delete_profile' profile.id %}" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i> Delete User
                                </a>
                            </div>
                        </div>
                    </div>
                {% endif %}
            {% endfor %}
        </div>
    </div>
    


    <!-- Bootstrap JS bundle (for dropdown functionality) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
