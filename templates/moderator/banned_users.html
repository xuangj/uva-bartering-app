{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <h2>Banned Users</h2>

    <table class="table table-hover table-bordered mt-4">
        <thead class="table-dark">
            <tr>
                <th>User</th>
                <th>Banned At</th>
                <th>Unban</th>
            </tr>
        </thead>
        <tbody>
            {% for p in banned_users %}
            <tr>
                <td>
                    <a href="{% url 'user_profile' p.user.username %}">
                        {{ p.user.username }}
                    </a>
                </td>
                <td>{{ p.banned_at|date:"M d, Y H:i" }}</td>
                <td>
                    <a href="{% url 'moderator_unban_user' p.user.id %}" class="btn btn-sm btn-success">
                        Unban
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
