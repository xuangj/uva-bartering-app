<!-- Template location: templates/socialaccount/login.html -->
<!-- This page appears when a user signs in with a social provider (e.g., Google) -->
<!-- and allauth needs confirmation before linking or creating the account. -->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Account - Trading App</title>
    <!-- Load Bootstrap 5 for modern styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-social-confirm {
            max-width: 550px;
            margin-top: 5rem;
            box-shadow: 0 6px 15px rgba(0,0,0,.15);
            border: none;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card card-social-confirm p-5">
            <h2 class="text-center mb-4">Connect Your Account</h2>
            
            <p class="lead text-center text-muted mb-4">You are about to sign in using your **{{ provider.name }}** account.</p>

            <!-- This is the form provided by django-allauth for confirmation -->
            <form method="post" class="text-center">
                {% csrf_token %}
                
                <!-- Display the social account information being linked -->
                <div class="alert alert-info py-3 mb-4 border-0 rounded-3">
                    <p class="m-0">
                        <img src="https://placehold.co/40x40/000000/FFFFFF?text=G" onerror="this.onerror=null;this.src='https://upload.wikimedia.org/wikipedia/commons/4/4a/Logo-google.png';" alt="{{ provider.name }} logo" style="height: 1.5rem; margin-right: 0.5rem;">
                        **Account:** {{ account.uid }}
                    </p>
                    {% if account.extra_data.name %}
                    <p class="m-0 mt-1">
                        **Name:** {{ account.extra_data.name }}
                    </p>
                    {% endif %}
                </div>

                <!-- Submit buttons -->
                <button type="submit" name="action_login" class="btn btn-primary btn-lg w-100 mb-2">
                    Confirm and Continue
                </button>
                
                <!-- Cancel link (optional, directs back to signup) -->
                <a href="{% url 'account_signup' %}" class="btn btn-outline-secondary w-100">Cancel</a>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
