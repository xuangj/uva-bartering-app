<!-- Template: templates/socialaccount/login.html -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Account - Trading App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-auth {
            max-width: 480px;
            margin-top: 5rem;
            box-shadow: 0 4px 8px rgba(0,0,0,.05);
            border: none;
        }
        .provider-logo {
            height: 1.5rem;
            margin-right: .5rem;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="card card-auth p-4">

            <h2 class="text-center mb-3">Connect Your Account</h2>
            <h6 class="text-center text-muted mb-4">
                You are about to sign in using your {{ provider.name }} account.
            </h6>

            <form method="post">
                {% csrf_token %}

                <button type="submit"
                        name="action_login"
                        class="btn btn-primary w-100 text-white mb-2">
                    Confirm & Continue
                </button>

                <a href="{% url 'account_signup' %}"
                   class="btn btn-outline-secondary w-100">
                    Cancel
                </a>

            </form>
        </div>
    </div>
</body>
</html>
