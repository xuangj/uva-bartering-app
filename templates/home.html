<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UVA Trading App</title>
</head>
<body>
  <h1>UVA Trading App</h1>
  {% if user.is_authenticated %}
    <p>Hello, {{ user.username }}! This is the home screen. </p>
    {% if user.is_staff or user.is_superuser %}
      <p>You have moderator privileges.</p>
      <a href="{% url 'moderator_dashboard' %}">Go to Moderator Dashboard</a>
    {% endif %}

    <a href="{% url 'account_logout' %}">Logout</a>
  {% else %}
    <p>You are not logged in.</p>
    <a href="{% url 'account_login' %}">Click to login</a>
  {% endif %}
</body>
</html>
