<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container-logout {
            max-width: 450px;
            margin-top: 5rem;
        }
    </style>
</head>
<body>
    
    <div class="container d-flex justify-content-center">
        <div class="container-logout text-center p-5 bg-white rounded-3 shadow">
            <h2 class="mb-3">Thank you for using the Trading App!</h2>
            <p class="mb-4 text-muted">Logout Below.</p>
            <form method="post" action="{% url 'account_logout' %}" class="d-inline">
                    {% csrf_token %}
                    <!-- This button looks like a link but triggers a POST request -->
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        Log Out
                    </button>
                </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
