<!-- Template: templates/account/signup.html -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Trading App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-auth {
            max-width: 500px;
            margin-top: 5rem;
            box-shadow: 0 4px 8px rgba(0,0,0,.05);
        }
        /* Label + Field alignment */
        .form-row {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .form-row label {
            width: 140px;
            text-align: right;
            margin: 0;
        }
        .form-row input {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="card card-auth p-4">

            <h2 class="text-center mb-3">Create Your Account</h2>
            <h6 class="text-center text-muted mb-4">Join the platform to start trading!</h6>

            <form method="post" action="{% url 'account_signup' %}">
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3 form-row">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary w-100 mt-3 text-white">
                    Sign Up
                </button>

                {% if redirect_field_value %}
                    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
                {% endif %}
            </form>

            <div class="text-center mt-3">
                <p class="small">
                    Already have an account?
                    <a href="{% url 'account_login' %}">Log In</a>
                </p>
            </div>

            {% load socialaccount %}
            {% providers_media_js %}

            <div class="text-center mt-3">
                <a href="{% provider_login_url 'google' %}"
                   class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center">

                    <img src="https://img.icons8.com/?size=100&id=17949&format=png&color=000000"
                         alt="Google Logo"
                         style="height: 1.2rem; margin-right: .5rem;">
                    Google
                </a>
            </div>

        </div>
    </div>

</body>
</html>
